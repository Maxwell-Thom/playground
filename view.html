<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Model Viewer</title>
<meta name="theme-color" content="#0d0f12">
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.4.0/dist/model-viewer.min.js" integrity="sha384-wjsPzEO+lXOf7d9csIDfAQpPt2OKuUU3m0K9qsdKIuzX4N8czSF6hdh23eAbZa3p" crossorigin="anonymous"></script>
<style>
  html, body { margin: 0; height: 100%; background: #0d0f12; color: #e8ecf1; font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  model-viewer { width: 100%; height: 100%; --poster-color: transparent; }
  .bar {
    position: fixed; left: 0; right: 0; top: 0; z-index: 2;
    display: flex; align-items: center; gap: 12px;
    padding: max(12px, env(safe-area-inset-top)) 16px 12px;
    background: linear-gradient(#0d0f12ee, #0d0f1200);
  }
  .bar a { color: #7cc4ff; text-decoration: none; }
  .bar span { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button[slot="ar-button"] {
    position: absolute; right: 16px; bottom: max(16px, env(safe-area-inset-bottom));
    background: #7cc4ff; color: #0d0f12; border: 0; border-radius: 999px;
    padding: 10px 18px; font: inherit; font-weight: 600;
  }
</style>
</head>
<body>
<div class="bar"><a href="./">← Back</a><span id="title"></span></div>
<model-viewer id="mv" camera-controls touch-action="pan-y" auto-rotate shadow-intensity="1"
  environment-image="neutral" ar ar-modes="webxr scene-viewer quick-look">
  <button slot="ar-button">View in your space</button>
</model-viewer>
<script>
  const q = new URLSearchParams(location.search);
  const src = q.get("m");
  document.getElementById("title").textContent = q.get("t") || src || "";
  if (src) document.getElementById("mv").src = src;
</script>
</body>
</html>
