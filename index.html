<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Unreal Playground</title>
<meta name="theme-color" content="#0d0f12">
<style>
  :root {
    --bg: #0d0f12; --panel: #161a20; --line: #262c35;
    --text: #e8ecf1; --muted: #8b95a3; --accent: #7cc4ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: max(20px, env(safe-area-inset-top)) 16px 40px;
  }
  header { max-width: 960px; margin: 0 auto 24px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; letter-spacing: -0.01em; }
  header p { margin: 0; color: var(--muted); }
  main {
    max-width: 960px; margin: 0 auto; display: grid; gap: 14px;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  }
  a.card {
    display: block; background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; overflow: hidden; color: inherit; text-decoration: none;
  }
  a.card:active { transform: scale(0.99); }
  .thumb { aspect-ratio: 16 / 10; background: #0a0c0f center / cover no-repeat; display: grid; place-items: center; color: var(--muted); font-size: 2rem; }
  .body { padding: 12px 14px 14px; }
  .kind { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); }
  .title { font-weight: 600; margin: 2px 0; }
  .desc { color: var(--muted); font-size: 0.9rem; }
  .empty { color: var(--muted); grid-column: 1 / -1; text-align: center; padding: 48px 0; }
</style>
</head>
<body>
<header>
  <h1>Unreal Playground</h1>
  <p>Things built with Claude + Unreal Engine 5.8</p>
</header>
<main id="grid"><div class="empty">Loading…</div></main>
<script>
  const icons = { model: "◆", image: "▣", video: "▶", page: "↗" };
  const hrefFor = (it) => it.type === "model" ? `view.html?m=${encodeURIComponent(it.src)}&t=${encodeURIComponent(it.title)}` : it.src;

  fetch("items.json", { cache: "no-store" })
    .then((r) => r.json())
    .then((items) => {
      const grid = document.getElementById("grid");
      if (!items.length) { grid.innerHTML = '<div class="empty">Nothing published yet.</div>'; return; }
      grid.replaceChildren(...items.slice().reverse().map((it) => {
        const a = document.createElement("a");
        a.className = "card"; a.href = hrefFor(it);
        const thumb = document.createElement("div");
        thumb.className = "thumb";
        if (it.thumb) thumb.style.backgroundImage = `url("${it.thumb}")`; else thumb.textContent = icons[it.type] || "•";
        const body = document.createElement("div");
        body.className = "body";
        for (const [cls, text] of [["kind", it.type], ["title", it.title], ["desc", it.description || ""]]) {
          const el = document.createElement("div"); el.className = cls; el.textContent = text; body.append(el);
        }
        a.append(thumb, body);
        return a;
      }));
    })
    .catch(() => { document.getElementById("grid").innerHTML = '<div class="empty">Couldn’t load items.json</div>'; });
</script>
</body>
</html>
